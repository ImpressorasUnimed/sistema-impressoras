<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Impressoras - Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: rgb(0, 64, 26);
    --card: rgba(255, 255, 255, 0.08);
    --border: #000;
    --accent: rgb(244, 121, 32);
    --text: #fbfbfb;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background-color: #1a1a1a;
}

.background {
    position: fixed;
    inset: 0;
    background: url('https://i.imgur.com/GMkHUDl.jpg') center/cover no-repeat;
    filter: blur(8px);
    transform: scale(1.08);
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: -1;
}

header {
    height: 110px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 25px;
    background: var(--bg);
    border-bottom: 3px solid var(--accent);
}

.menu-btn {
    font-size: 30px;
    cursor: pointer;
    color: var(--accent);
}

.logo {
    height: 80px;
    max-width: 75%;
    object-fit: contain;
}

.layout {
    display: flex;
    height: calc(100vh - 110px);
}

aside {
    width: 260px;
    background: rgba(0,0,0,.6);
    border-right: 2px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: .3s;
}

aside.closed { margin-left: -260px; }

aside button {
    padding: 16px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
}

aside button.active, aside button:hover {
    background: var(--accent);
    color: #000;
    font-weight: bold;
}

main {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
}

.section { display: none; max-width: 1100px; margin: 0 auto; }
.section.active { display: block; }

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

input, select {
    padding: 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--text);
    outline: none;
}

button.primary {
    padding: 16px 40px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button.primary:hover { opacity: 0.9; transform: translateY(-2px); }

table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    overflow: hidden;
}

th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
th { background: rgba(0,0,0,0.5); color: var(--accent); text-transform: uppercase; font-size: 12px; }

/* Estilo das Imagens das Impressoras */
.printer-img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    background: white;
    border-radius: 8px;
    padding: 4px;
}

.btn-del {
    background: transparent;
    border: 1px solid #ff4d4d;
    color: #ff4d4d;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
}

@media (max-width: 768px) {
    aside { position: fixed; top: 110px; height: 100%; z-index: 10; }
    aside.closed { transform: translateX(-100%); margin-left: 0; }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <img src="https://i.imgur.com/ssKFTTB.jpg" class="logo">
</header>

<div class="layout">
    <aside id="menu" class="closed">
        <button class="active" onclick="mostrar('pesquisa', this)">🔍 Pesquisa</button>
        <button onclick="mostrar('cadastro', this)">🛠️ Cadastro</button>
    </aside>

    <main>
        <section id="pesquisa" class="section active">
            <div class="form-grid">
                <select id="tipoBusca" onchange="buscar()">
                    <option value="codigo">Código</option>
                    <option value="setor">Setor</option>
                    <option value="ip">IP</option>
                    <option value="modelo">Modelo/Toner</option>
                </select>
                <input id="campoBusca" placeholder="Pesquisar..." onkeyup="buscar()">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Equipamento</th>
                        <th>Código</th>
                        <th>Setor</th>
                        <th>IP</th>
                        <th>Modelo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="resultado"></tbody>
            </table>
        </section>

        <section id="cadastro" class="section">
            <div class="form-grid">
                <input id="codigo" placeholder="Código (ex: H-107)">
                <input id="setor" placeholder="Setor">
                <input id="ip" placeholder="Endereço IP">
                
                <select id="modelo">
                    <option value="">Selecione o Modelo</option>
                    <option value="RICOH-M320F">RICOH-M320F</option>
                    <option value="SAMSUNG - M4080FX">SAMSUNG - M4080FX</option>
                    <option value="RICOH-P311">RICOH-P311</option>
                    <option value="RICOH-SP3500N">RICOH-SP3500N</option>
                    <option value="SAMSUNG - M4070 FR">SAMSUNG - M4070 FR</option>
                    <option value="SANSUNG - M4020DN">SANSUNG - M4020DN</option>
                    <option value="BROTHER NC-9200h">BROTHER NC-9200h</option>
                    <option value="RICOH-SP3710SF">RICOH-SP3710SF</option>
                    <option value="RICOH-SP3710DN">RICOH-SP3710DN</option>
                    <option value="Scanner Dr C240">Scanner Dr C240</option>
                    <option value="Zebra ZD220">Zebra ZD220</option>
                    <option value="Zebra Zd230">Zebra Zd230</option>
                </select>
            </div>
            <button class="primary" onclick="salvar()">Cadastrar Impressora</button>
        </section>
    </main>
</div>

<script>
const API = "https://sheetdb.io/api/v1/pyn96szziv9xf";

// Dicionário de Imagens (Substitua os links pelas imagens reais)
const databaseImagens = {
    "RICOH-M320F": "https://imgur.com/TnVzF7n",
    "SAMSUNG - M4080FX": "https://imgur.com/AvaC68X",
    "RICOH-P311": "https://imgur.com/9ZmWD89",
    "RICOH-SP3500N": "https://imgur.com/7Tebo1j",
    "SAMSUNG - M4070 FR": "https://imgur.com/zDY55Wb",
    "SANSUNG - M4020DN": "https://imgur.com/RyxlkRS",
    "BROTHER NC-9200h": "https://imgur.com/ga2viDQ",
    "RICOH-SP3710SF": "https://imgur.com/dtVuDle",
    "RICOH-SP3710DN": "https://imgur.com/RxSTyIZ",
    "Scanner Dr C240": "https://cdn-icons-png.flaticon.com/512/2822/2822965.png",
    "Zebra ZD220": "https://imgur.com/AChOQKS",
    "Zebra Zd230": "https://imgur.com/R0onxJb",
    "default": "https://via.placeholder.com/60?text=Maq"
};

function toggleMenu() { menu.classList.toggle("closed"); }

function mostrar(id, btn) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.querySelectorAll("aside button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (window.innerWidth <= 768) toggleMenu();
}

async function buscar() {
    const tipo = tipoBusca.value;
    const termo = campoBusca.value;
    let url = API;

    if (termo) url += `/search?${tipo}=*${encodeURIComponent(termo)}*`;

    try {
        const r = await fetch(url);
        const dados = await r.json();
        resultado.innerHTML = "";

        dados.forEach(i => {
            // Pega a imagem baseada no modelo, se não existir usa a default
            const imgUrl = databaseImagens[i.modelo] || databaseImagens["default"];

            resultado.innerHTML += `
            <tr>
                <td><img src="${imgUrl}" class="printer-img"></td>
                <td style="color:var(--accent); font-weight:bold;">${i.codigo}</td>
                <td>${i.setor}</td>
                <td><a href="http://${i.ip}" target="_blank" style="color:lightblue; text-decoration:none;">${i.ip} 🌐</a></td>
                <td>${i.modelo}</td>
                <td>
                    <button class="btn-del" onclick="excluir('${i.codigo}')">🗑️</button>
                </td>
            </tr>`;
        });
    } catch(e) { console.error("Erro ao buscar dados"); }
}

async function salvar() {
    const dados = {
        codigo: codigo.value.toUpperCase().trim(),
        setor: setor.value.toUpperCase().trim(),
        ip: ip.value.trim(),
        modelo: modelo.value
    };

    if (!dados.codigo || !dados.ip || !dados.modelo) {
        alert("Preencha todos os campos corretamente.");
        return;
    }

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: [dados] })
    });

    // Limpa campos
    codigo.value = setor.value = ip.value = modelo.value = "";
    alert("Cadastrado com sucesso!");
    buscar();
}

async function excluir(cod) {
    if (!confirm(`Excluir impressora ${cod}?`)) return;
    await fetch(`${API}/codigo/${cod}`, { method: "DELETE" });
    buscar();
}

buscar();
</script>

</body>
</html>
